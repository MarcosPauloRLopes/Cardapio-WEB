<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor de Casa - Gerenciar Categorias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-sistema">
        <div class="logo">Sabor de Casa</div>
        <nav class="nav-links">
            <a href="index.html">Cardápio</a>
            <a href="development.html" class="ativo">Gerenciar</a>
        </nav>
    </header>

    <main class="container-principal">
        <div class="card-categoria espaco-abaixo">
            <div class="cabecalho-pagina">
                <div>
                    <a href="development.html" class="link-voltar-cat">← Categorias</a>
                    <h2 class="titulo-form-cat">Gerenciar Categorias</h2>
                </div>
                <button type="button" class="btn-novo" onclick="toggleFormCat()">+ Nova categoria</button>
            </div>
        </div>

        <div id="boxNovaCategoria" class="card-categoria espaco-abaixo oculto">
            <div class="card-info">
                <form onsubmit="criarCategoria(event)">
                    <h3 class="titulo-form-cat">Nova categoria</h3>

                    <div class="form-group">
                        <label for="nomeCat">Nome da categoria *</label>
                        <input type="text" id="nomeCat" required placeholder="Ex: Bebidas">
                    </div>

                    <div class="form-group">
                        <label for="descCat">Descrição (opcional)</label>
                        <input type="text" id="descCat" placeholder="Ex: Sucos, refrigerantes e águas" maxlength="255">
                    </div>

                    <div class="prato-controles">
                        <button type="submit" class="btn-novo">Cadastrar categoria</button>
                        <button type="button" onclick="toggleFormCat()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="listaCategorias"></div>
    </main>

    <div id="toastSucesso" class="toast-sucesso">
        <span id="textoToast"></span>
    </div>

    <script src="script.js"></script>
    <script>
        let categoriasDados = [];
        let idEditando = null;

        function toggleFormCat() {
            const box = document.getElementById('boxNovaCategoria');
            box.classList.toggle('oculto');
            if (!box.classList.contains('oculto')) document.getElementById('nomeCat').focus();
        }

        function abrirFecharEdicao(id) {
            idEditando = idEditando === id ? null : id;
            renderCategorias();
            if (idEditando !== null) {
                document.getElementById(`desc-input-${id}`).focus();
            }
        }

        async function listarCategorias() {
            try {
                categoriasDados = await chamarApi('/categorias');
                renderCategorias();
            } catch (erro) {
                console.error('Erro ao carregar categorias:', erro);
                document.getElementById('listaCategorias').innerHTML = '<p>Erro ao carregar categorias.</p>';
            }
        }

        function renderCategorias() {
            const lista = document.getElementById('listaCategorias');
            lista.innerHTML = '';

            if (categoriasDados.length === 0) {
                lista.innerHTML = '<p>Nenhuma categoria cadastrada.</p>';
                return;
            }

            categoriasDados.forEach((c) => {
                const total = Number(c.total_pratos);
                const aberto = idEditando === c.id_categoria;
                const descricao = c.descricao_categoria || '';

                const card = document.createElement('div');
                card.className = 'card-prato';
                card.innerHTML = `
                    <div class="prato-esquerda">
                        <strong class="prato-nome">${c.nome_categoria}</strong>
                    </div>

                    <div class="prato-meio">
                        <span class="prato-desc">${total} prato(s)${descricao ? ` • ${descricao}` : ''}</span>
                    </div>

                    <div class="prato-direita">
                        <div class="prato-controles">
                            <button type="button" class="btn-editar" onclick="abrirFecharEdicao(${c.id_categoria})">
                                Editar Descrição
                            </button>
                            <button
                                type="button"
                                class="btn-excluir"
                                ${total > 0 ? 'disabled title="Categoria possui pratos"' : ''}
                                onclick="excluirCategoriaTela(${c.id_categoria})"
                            >
                                Remover
                            </button>
                        </div>
                    </div>

                    ${aberto ? `
                        <div class="painel-edicao">
                            <div class="form-group">
                                <label for="desc-input-${c.id_categoria}">Qual a nova descrição para "${c.nome_categoria}"?</label>
                                <input type="text" id="desc-input-${c.id_categoria}" value="${descricao.replace(/"/g, '&quot;')}" maxlength="255" placeholder="Ex: Sucos, refrigerantes e águas">
                            </div>
                            <div class="prato-controles">
                                <button type="button" class="btn-novo" onclick="confirmarEdicao(${c.id_categoria})">
                                    Salvar descrição
                                </button>
                                <button type="button" onclick="abrirFecharEdicao(${c.id_categoria})">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                    ` : ''}
                `;

                lista.appendChild(card);
            });
        }

        async function confirmarEdicao(id) {
            const novaDescricao = document.getElementById(`desc-input-${id}`).value.trim();

            if (await modificarCategoria(id, novaDescricao)) {
                idEditando = null;
                listarCategorias();
            }
        }

        async function excluirCategoriaTela(id) {
            if (await removerCategoria(id)) {
                if (idEditando === id) idEditando = null;
                listarCategorias();
            }
        }

        async function criarCategoria(event) {
            event.preventDefault();

            const cadastrou = await adicionarCategoria({
                nome_categoria: document.getElementById('nomeCat').value.trim(),
                descricao_categoria: document.getElementById('descCat').value.trim()
            });

            if (cadastrou) {
                event.target.reset();
                toggleFormCat();
                listarCategorias();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            listarCategorias();

            // Vindo do botão "+ Nova categoria" da tela anterior, já abre o formulário.
            if (new URLSearchParams(window.location.search).get('nova') === 'true') {
                toggleFormCat();
            }
        });
    </script>
</body>
</html>
