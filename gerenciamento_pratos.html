<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor de Casa - Gerenciamento de Pratos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-sistema">
        <div class="logo">Sabor de Casa</div>
        <nav class="nav-links">
            <a href="index.html">Cardápio</a>
            <a href="development.html" class="ativo">Gerenciar</a>
        </nav>
    </header>

    <main class="container-principal">
        <div class="card-categoria espaco-abaixo">
            <div class="cabecalho-pagina">
                <div>
                    <a href="development.html" class="link-voltar-cat">← Voltar para Categorias</a>
                    <h2 id="tituloCategoriaNome" class="titulo-form-cat">Gerenciamento de Pratos</h2>
                </div>
                <button type="button" class="btn-novo" onclick="alternarFormPrato()">+ Novo prato</button>
            </div>
        </div>

        <div id="cardNovoPrato" class="card-categoria espaco-abaixo oculto">
            <div class="card-info">
                <h3>Adicionar novo prato</h3>
                <form onsubmit="enviarNovoPrato(event)">
                    <div class="form-group">
                        <label for="nomePrato">Nome do prato *</label>
                        <input type="text" id="nomePrato" required placeholder="Ex: Suco de Laranja Natural">
                    </div>

                    <div class="form-group">
                        <label for="descricaoPrato">Descrição</label>
                        <input type="text" id="descricaoPrato" placeholder="Ex: Copo de 400ml feito com frutas frescas">
                    </div>

                    <div class="form-group">
                        <label for="precoPrato">Preço (R$) *</label>
                        <input type="text" id="precoPrato" required placeholder="Ex: 8.50">
                    </div>

                    <div class="prato-controles">
                        <button type="submit" class="btn-novo">Cadastrar prato</button>
                        <button type="button" onclick="alternarFormPrato()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="listaPratos"></div>
    </main>

    <div id="toastSucesso" class="toast-sucesso">
        <span id="textoToast"></span>
    </div>

    <script src="script.js"></script>
    <script>
        // Número da categoria vindo da URL (0 se não tiver).
        const categoriaId = Number(new URLSearchParams(window.location.search).get('categoria_id'));

        function alternarFormPrato() {
            const box = document.getElementById('cardNovoPrato');
            box.classList.toggle('oculto');
            if (!box.classList.contains('oculto')) document.getElementById('nomePrato').focus();
        }

        async function carregarPratosTela() {
            const lista = document.getElementById('listaPratos');

            try {
                const [listaCategorias, todosPratos] = await Promise.all([chamarApi('/categorias'), chamarApi('/pratos')]);

                const categoria = listaCategorias.find((c) => c.id_categoria === categoriaId);
                if (categoria) document.getElementById('tituloCategoriaNome').textContent = categoria.nome_categoria;

                const pratosDaCategoria = todosPratos.filter((p) => !categoriaId || p.id_categoria_prato === categoriaId);

                lista.innerHTML = '';
                if (pratosDaCategoria.length === 0) {
                    lista.innerHTML = '<p>Nenhum prato cadastrado nesta categoria.</p>';
                    return;
                }

                pratosDaCategoria.forEach((p) => {
                    const disponivel = p.disponivel === 1;

                    const card = document.createElement('div');
                    card.className = 'card-prato';
                    card.innerHTML = `
                        <div class="prato-esquerda"><strong class="prato-nome">${p.nome_prato}</strong></div>
                        <div class="prato-meio">
                            ${p.desc_prato ? `<span class="prato-desc">${p.desc_prato}</span>` : ''}
                            <small class="prato-status">
                                ${formatarMoeda(p.preco_prato)} • Status: <strong>${disponivel ? 'Disponível' : 'Indisponível'}</strong>
                            </small>
                        </div>
                        <div class="prato-direita">
                            <div class="prato-controles">
                                <button type="button" onclick="alternarDisponibilidadeTela(${p.id_prato}, ${p.disponivel})">
                                    ${disponivel ? 'Marcar indisponível' : 'Marcar disponível'}
                                </button>
                                <button type="button" class="btn-excluir" onclick="excluirPratoTela(${p.id_prato})">
                                    Remover
                                </button>
                            </div>
                        </div>
                    `;
                    lista.appendChild(card);
                });
            } catch (erro) {
                console.error('Erro ao carregar pratos:', erro);
                lista.innerHTML = '<p>Erro ao carregar os pratos.</p>';
            }
        }

        async function alternarDisponibilidadeTela(id, disponivelAtual) {
            if (await alternarDisponibilidadePrato(id, disponivelAtual)) carregarPratosTela();
        }

        async function excluirPratoTela(id) {
            if (await removerPrato(id)) carregarPratosTela();
        }

        async function enviarNovoPrato(event) {
            event.preventDefault();

            // O servidor valida o nome, o preço e a categoria e devolve a mensagem de erro.
            const cadastrou = await adicionarPrato({
                nome_prato: document.getElementById('nomePrato').value,
                desc_prato: document.getElementById('descricaoPrato').value,
                preco_prato: document.getElementById('precoPrato').value,
                id_categoria_prato: categoriaId
            });

            if (cadastrou) {
                event.target.reset();
                alternarFormPrato();
                carregarPratosTela();
            }
        }

        window.addEventListener('DOMContentLoaded', carregarPratosTela);
    </script>
</body>
</html>
