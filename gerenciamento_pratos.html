<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor de Casa - Gerenciamento de Pratos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-sistema">
        <div class="logo">Sabor de Casa</div>
        <nav class="nav-links">
            <a href="index.html">Cardápio</a>
            <a href="development.html" class="ativo">Gerenciar</a>
        </nav>
    </header>

    <main class="container-principal">
        <div class="card-categoria" style="margin-bottom: 20px;">
            <div class="card-info" style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 12px;">
                <div>
                    <a href="development.html" class="link-voltar-cat">← Voltar para Categorias</a>
                    <h2 id="tituloCategoriaNome" class="titulo-form-cat" style="margin-top: 4px;">Gerenciamento de Pratos</h2>
                </div>
                <button type="button" class="btn-novo" onclick="alternarFormPrato()">+ Novo prato</button>
            </div>
        </div>

        <div id="cardNovoPrato" class="card-categoria" style="display: none; margin-bottom: 20px;">
            <div class="card-info" style="width: 100%;">
                <h3>Adicionar novo prato</h3>
                <form onsubmit="enviarNovoPrato(event)" style="margin-top: 12px;">
                    <div class="form-group">
                        <label for="nomePrato">Nome do prato *</label>
                        <input type="text" id="nomePrato" required placeholder="Ex: Suco de Laranja Natural">
                    </div>

                    <div class="form-group">
                        <label for="descricaoPrato">Descrição</label>
                        <input type="text" id="descricaoPrato" placeholder="Ex: Copo de 400ml feito com frutas frescas">
                    </div>

                    <div class="form-group">
                        <label for="precoPrato">Preço (R$) *</label>
                        <input type="text" id="precoPrato" required placeholder="Ex: 8.50">
                    </div>

                    <div class="prato-controles">
                        <button type="submit" class="btn-novo">Cadastrar prato</button>
                        <button type="button" onclick="alternarFormPrato()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="listaPratos"></div>
    </main>

    <script src="script.js"></script>
    <script>
        const categoriaId = new URLSearchParams(window.location.search).get('categoria_id');

        function alternarFormPrato() {
            const box = document.getElementById('cardNovoPrato');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
            if (box.style.display === 'block') document.getElementById('nomePrato')?.focus();
        }

        async function carregarPratosTela() {
            const listaEl = document.getElementById('listaPratos');
            const tituloEl = document.getElementById('tituloCategoriaNome');

            try {
                const [resCat, resPratos] = await Promise.all([
                    fetch(`${API_URL}/categorias`, { cache: 'no-store' }),
                    fetch(`${API_URL}/pratos`, { cache: 'no-store' })
                ]);
                const categorias = await resCat.json();
                const todosPratos = await resPratos.json();

                const cat = Array.isArray(categorias)
                    ? categorias.find((c) => Number(c.id_categoria) === Number(categoriaId))
                    : null;
                if (cat) tituloEl.textContent = cat.nome_categoria;

                const filtrados = Array.isArray(todosPratos)
                    ? todosPratos.filter((p) => !categoriaId || Number(p.id_categoria_prato) === Number(categoriaId))
                    : [];

                listaEl.innerHTML = '';
                if (!filtrados.length) {
                    listaEl.innerHTML = '<p>Nenhum prato cadastrado nesta categoria.</p>';
                    return;
                }

                filtrados.forEach((p) => {
                    const disp = Number(p.disponivel) === 1;
                    const preco = Number(p.preco_prato ?? 0).toFixed(2).replace('.', ',');
                    const card = document.createElement('div');
                    card.className = 'card-prato';
                    card.innerHTML = `
                        <div class="prato-esquerda"><strong class="prato-nome">${p.nome_prato}</strong></div>
                        <div class="prato-meio">
                            ${p.desc_prato ? `<span class="prato-desc">${p.desc_prato}</span>` : ''}
                            <small style="display: block; margin-top: 4px;">
                                R$ ${preco} • Status: <strong>${disp ? 'Disponível' : 'Indisponível'}</strong>
                            </small>
                        </div>
                        <div class="prato-direita">
                            <div class="prato-controles">
                                <button type="button" onclick="alternarDisponibilidadePrato(${p.id_prato}, ${p.disponivel}).then(r => r && carregarPratosTela())">
                                    ${disp ? 'Marcar indisponível' : 'Marcar disponível'}
                                </button>
                                <button type="button" class="btn-excluir" onclick="removerPrato(${p.id_prato}).then(r => r && carregarPratosTela())">
                                    Remover
                                </button>
                            </div>
                        </div>
                    `;
                    listaEl.appendChild(card);
                });
            } catch (err) {
                console.error('Erro ao carregar pratos:', err);
                listaEl.innerHTML = '<p>Erro ao carregar os pratos.</p>';
            }
        }

        function enviarNovoPrato(event) {
            event.preventDefault();
            const preco = parseFloat(document.getElementById('precoPrato').value.trim().replace(',', '.'));
            if (isNaN(preco) || preco <= 0) {
                alert('O preço do prato deve ser maior que R$ 0,00.');
                return;
            }

            adicionarPrato({
                nome_prato: document.getElementById('nomePrato').value.trim(),
                desc_prato: document.getElementById('descricaoPrato').value.trim(),
                preco_prato: preco,
                id_categoria_prato: Number(categoriaId),
                disponivel: 1
            }).then((res) => {
                if (!res) return;
                event.target.reset();
                alternarFormPrato();
                carregarPratosTela();
            });
        }

        window.addEventListener('DOMContentLoaded', carregarPratosTela);
    </script>
</body>
</html>
