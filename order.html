<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor de Casa - Pedido de Compra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-sistema">
        <div class="logo">Sabor de Casa</div>
        <nav class="nav-links">
            <a href="index.html">Cardápio</a>
            <a href="development.html">Gerenciar</a>
            <a href="order.html" class="ativo"><img src="imagens/logo.carrinho.png" alt="">Carrinho</a>
        </nav>
    </header>

    <main class="container-principal">
        <div class="cabecalho-form-container">
            <a href="index.html" class="link-voltar-cat">← Voltar ao cardápio</a>
            <h1 class="titulo-form-cat">Pedido de compra</h1>
        </div>

        <div id="lista-pedido"></div>

        <div id="resumo-pedido" class="rodape-checkout oculto">
            <div class="rodape-checkout-info">
                <span>Itens: <strong id="pedido-qtd-itens">0</strong></span>
                <span>Total do carrinho: <strong id="pedido-valor-total">R$ 0,00</strong></span>
            </div>
            <div class="prato-controles">
                <a href="checkout.html" class="btn-ir-checkout">Continuar para checkout</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        function alterarQuantidade(index, delta) {
            const itens = lerCarrinho();
            if (!itens[index]) return;

            itens[index].quantidade += delta;
            if (itens[index].quantidade <= 0) {
                itens.splice(index, 1);
            }
            salvarCarrinho(itens);
            renderizarPedido();
        }

        function removerItemPedido(index) {
            const itens = lerCarrinho();
            itens.splice(index, 1);
            salvarCarrinho(itens);
            renderizarPedido();
        }

        function renderizarPedido() {
            const itens = lerCarrinho();
            const container = document.getElementById('lista-pedido');
            const resumo = document.getElementById('resumo-pedido');

            container.innerHTML = '';

            if (itens.length === 0) {
                resumo.classList.add('oculto');
                container.innerHTML = `
                    <div class="card-prato card-vazio">
                        <p class="prato-desc">Seu pedido de compra está vazio no momento.</p>
                        <a href="index.html" class="btn-ir-checkout">Ver cardápio</a>
                    </div>
                `;
                return;
            }

            itens.forEach((item, index) => {
                const qtd = Number(item.quantidade) || 1;
                const precoUnitario = Number(item.preco) || 0;
                const subtotal = qtd * precoUnitario;

                const card = document.createElement('div');
                card.className = 'card-prato';
                card.innerHTML = `
                    <div class="prato-esquerda">
                        <strong class="prato-nome">${item.nome_prato}</strong>
                    </div>

                    <div class="prato-meio">
                        <span class="prato-desc">
                            Qtd: <strong>${qtd}</strong> &nbsp;|&nbsp;
                            Unitário: <strong>${formatarMoeda(precoUnitario)}</strong> &nbsp;|&nbsp;
                            Total do item: <strong>${formatarMoeda(subtotal)}</strong>
                        </span>
                    </div>

                    <div class="prato-direita">
                        <span class="prato-preco">${formatarMoeda(subtotal)}</span>
                        <div class="prato-controles">
                            <button type="button" onclick="alterarQuantidade(${index}, -1)">-</button>
                            <button type="button" onclick="alterarQuantidade(${index}, 1)">+</button>
                            <button type="button" onclick="removerItemPedido(${index})">Remover</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const { qtd, total } = calcularTotais(itens);
            document.getElementById('pedido-qtd-itens').textContent = qtd;
            document.getElementById('pedido-valor-total').textContent = formatarMoeda(total);
            resumo.classList.remove('oculto');
        }

        window.addEventListener('DOMContentLoaded', renderizarPedido);
    </script>
</body>
</html>
